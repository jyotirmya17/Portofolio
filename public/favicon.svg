  <circle cx="64.5" cy="54" r="2.2" fill="#FFFFFF" />
  <circle cx="35.5" cy="58.5" r="1.1" fill="rgba(255, 255, 255, 0.7)" />
  <circle cx="67.5" cy="58.5" r="1.1" fill="rgba(255, 255, 255, 0.7)" />

  <!-- Nose -->
